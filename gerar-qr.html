<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; upgrade-insecure-requests">
<title>QR Code | Kaká Lanches</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#111;color:#fff;margin:0;padding:24px}
.box{max-width:650px;margin:auto;background:#1b1b1b;border:1px solid #2c2c2c;border-radius:20px;padding:24px}
h1{margin-top:0}
p{line-height:1.5;color:#d0d0d0}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;background:#ffb41f;color:#17100a;font-weight:900;cursor:pointer}
#qrcode{display:flex;justify-content:center;align-items:center;background:#fff;padding:20px;border-radius:16px;margin:18px auto 0;min-height:220px}
#qrcode img,#qrcode canvas{max-width:100%;height:auto}
.status{margin-top:12px;color:#aaa;font-size:14px;overflow-wrap:anywhere}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous" defer></script>
<script src="gerar-qr.js" defer></script>
</head>
<body>
<main class="box">
<h1>QR Code permanente</h1>
<p>Este QR Code aponta exclusivamente para o cardápio oficial do Kaká Lanches. O endereço é fixo e não pode ser alterado nesta página.</p>
<button id="gerar" type="button">Gerar / Atualizar QR Code</button>
<div id="qrcode" role="img" aria-label="QR Code do cardápio oficial"></div>
<div class="status" id="status" aria-live="polite">Destino fixo: https://kaka-lanches.github.io/cardapio/</div>
</main>
</body>
</html>
